{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-4 text-center">Student Risk Predictor</h2>

    {% if students_list %}
    <form method="POST" class="space-y-4">
        <div>
            <label class="block font-medium">Select Student</label>
            <select name="student_id" class="w-full border rounded px-3 py-2" required>
                <option value="">-- Select --</option>
                {% for sid in students_list %}
                <option value="{{ sid }}" {% if sid == selected_student_id %}selected{% endif %}>{{ sid }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white rounded py-2 font-bold hover:bg-blue-500 transition">Predict</button>
    </form>
    {% else %}
    <p class="text-center text-red-500 font-semibold">No students uploaded yet. Please upload CSV in the dashboard.</p>
    {% endif %}

    {% if prediction %}
    <div class="mt-4 bg-blue-100 text-blue-800 p-4 rounded text-center font-semibold">
        {{ prediction }}
    </div>
    {% endif %}
</div>
{% endblock %}
