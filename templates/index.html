{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-4 text-center">Student Risk Predictor</h2>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block font-medium">Student ID</label>
            <input type="number" name="student_id" class="w-full border rounded px-3 py-2" required>
        </div>

        <div>
            <label class="block font-medium">Attendance (0 or 1)</label>
            <input type="number" name="attendance" class="w-full border rounded px-3 py-2" required>
        </div>

        <div>
            <label class="block font-medium">Homework Rate (0 or 1)</label>
            <input type="number" name="homework" class="w-full border rounded px-3 py-2" required>
        </div>

        <div>
            <label class="block font-medium">Midterm Score (0–100)</label>
            <input type="number" name="midterm" class="w-full border rounded px-3 py-2" required>
        </div>

        <div>
            <label class="block font-medium">Participation (0 or 1)</label>
            <input type="number" name="participation" class="w-full border rounded px-3 py-2" required>
        </div>

        <div>
            <label class="block font-medium">Previous GPA (0–4)</label>
            <input type="number" step="0.01" name="gpa" class="w-full border rounded px-3 py-2" required>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white rounded py-2 font-bold hover:bg-blue-500 transition">Predict</button>
    </form>

    {% if prediction %}
    <div class="mt-4 bg-blue-100 text-blue-800 p-4 rounded text-center font-semibold">
        {{ prediction }}
    </div>
    {% endif %}
</div>
{% endblock %}
