{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6 text-center">Dashboard</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
    <div class="bg-white p-6 rounded shadow text-center">
        <h3 class="text-xl font-semibold mb-2">Total Students</h3>
        <p class="text-3xl font-bold">{{ stats.total_students }}</p>
    </div>

    <div class="bg-white p-6 rounded shadow text-center">
        <h3 class="text-xl font-semibold mb-2">Passing Students</h3>
        <p class="text-3xl font-bold text-green-600">{{ stats.passing }}</p>
    </div>

    <div class="bg-white p-6 rounded shadow text-center">
        <h3 class="text-xl font-semibold mb-2">At-Risk Students</h3>
        <p class="text-3xl font-bold text-red-600">{{ stats.at_risk }}</p>
    </div>

    <div class="bg-white p-6 rounded shadow text-center">
        <h3 class="text-xl font-semibold mb-2">Average GPA</h3>
        <p class="text-3xl font-bold">{{ stats.average_gpa | round(2) }}</p>
    </div>
</div>

<!-- CSV Upload -->
<div class="bg-white p-6 rounded shadow max-w-lg mx-auto">
    <h3 class="text-xl font-semibold mb-4 text-center">Upload Student CSV</h3>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv" class="mb-4">
        <button type="submit" class="w-full bg-blue-600 text-white rounded py-2 font-bold hover:bg-blue-500 transition">Upload</button>
    </form>
</div>

{% endblock %}
