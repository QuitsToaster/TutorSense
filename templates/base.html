<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TutorSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: linear-gradient(to bottom right, #eef2ff, #e0e7ff);
        }
    </style>
</head>
<body class="min-h-screen text-gray-800">

<!-- Navbar -->
<nav class="bg-white/80 backdrop-blur-md shadow-md py-4 sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center px-4">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-blue-600 rounded-full animate-pulse"></div>
            <div class="font-bold text-2xl tracking-wide text-blue-700">TutorSense</div>
        </div>

        <div class="space-x-6 font-medium">
            <a href="/" class="{% if active_page=='dashboard' %}text-blue-600 font-semibold border-b-2 border-blue-500{% else %}hover:text-blue-500{% endif %}">
                Dashboard
            </a>
            <a href="/predict" class="{% if active_page=='predict' %}text-blue-600 font-semibold border-b-2 border-blue-500{% else %}hover:text-blue-500{% endif %}">
                Predictor
            </a>
            <a href="/about" class="{% if active_page=='about' %}text-blue-600 font-semibold border-b-2 border-blue-500{% else %}hover:text-blue-500{% endif %}">
                About
            </a>
        </div>
    </div>
</nav>

<div class="container mx-auto mt-10 px-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
