<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TutorSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-blue-600 p-4 text-white">
    <div class="container mx-auto flex justify-between items-center">
        <div class="font-bold text-xl">TutorSense</div>
        <div class="space-x-4">
            <a href="/" class="hover:text-gray-300 {% if active_page=='dashboard' %}underline font-semibold{% endif %}">Dashboard</a>
            <a href="/predict" class="hover:text-gray-300 {% if active_page=='predict' %}underline font-semibold{% endif %}">Predictor</a>
            <a href="/about" class="hover:text-gray-300 {% if active_page=='about' %}underline font-semibold{% endif %}">About</a>
        </div>
    </div>
</nav>

<div class="container mx-auto mt-8">
    {% block content %}{% endblock %}
</div>

</body>
</html>
