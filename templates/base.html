<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TutorSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0; /* Fixes unwanted space on top */
            background: linear-gradient(to bottom right, #eef2ff, #e0e7ff);
        }

        .nav-link {
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: background 0.3s ease;
        }

        .nav-link:hover {
            background-color: #4f46e5;
            color: white;
        }

        .nav-active {
            background-color: #4f46e5 !important;
            color: white !important;
        }
    </style>
</head>

<body class="min-h-screen text-gray-800">

<!-- NAVBAR -->
<nav class="bg-white/70 backdrop-blur-md shadow-md py-4 px-8 flex justify-between items-center fixed w-full z-20 top-0 left-0">
    <div class="flex items-center space-x-2">
        <div class="w-3 h-3 bg-blue-500 rounded-full"></div>
        <span class="font-bold text-xl text-blue-700">TutorSense</span>
    </div>

    <div class="flex space-x-4">
        <a href="{{ url_for('dashboard') }}"
           class="nav-link {% if active_page=='dashboard' %}nav-active{% endif %}">Dashboard</a>

        <a href="{{ url_for('index') }}"
           class="nav-link {% if active_page=='predict' %}nav-active{% endif %}">Predictor</a>

        <a href="{{ url_for('about') }}"
           class="nav-link {% if active_page=='about' %}nav-active{% endif %}">About</a>
    </div>
</nav>

<!-- CONTENT WRAPPER -->
<div class="container mx-auto px-4 mt-24">
    {% block content %}{% endblock %}
</div>

</body>
</html>
